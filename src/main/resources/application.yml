spring:
  application:
    name: news-search

  datasource:
    url: jdbc:mysql://localhost:3306/demo1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: hvnh2004
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  elasticsearch:
    uris: http://localhost:9200

server:
  port: 8080

